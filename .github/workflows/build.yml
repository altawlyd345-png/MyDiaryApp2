name: Build APKs
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        app: [sender, receiver]
    steps:
      - uses: actions/checkout@v4
      - name: Locate the app (unzips WALIBRA_*.zip if you uploaded the zip itself)
        id: loc
        run: |
          root=.
          zipf=$(ls WALIBRA_*.zip 2>/dev/null | sort | tail -n1 || true)
          if [ -n "$zipf" ]; then
            echo "Using $zipf"
            rm -rf _src && mkdir _src && unzip -oq "$zipf" -d _src && root=_src
          fi
          d=$(find "$root" -type d -name "${{ matrix.app }}" -not -path "*/.git/*" -exec test -f {}/main.py \; -print | head -n1)
          d=${d#./}
          test -n "$d" || { echo "::error::could not find a '${{ matrix.app }}' folder containing main.py"; exit 1; }
          echo "App folder: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Make sure the font is there (needed for joined Arabic + Latin)
        run: |
          f="${{ steps.loc.outputs.dir }}/fonts/DejaVuSans.ttf"
          if [ ! -f "$f" ]; then
            echo "::warning::$f was not uploaded - taking DejaVu from the system instead"
            sudo apt-get install -y fonts-dejavu-core
            mkdir -p "${{ steps.loc.outputs.dir }}/fonts"
            cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf "$f"
          fi
          ls -la "${{ steps.loc.outputs.dir }}/fonts"
      - name: Check that every source file was uploaded
        run: |
          case "${{ matrix.app }}" in
            sender) req="buildozer.spec crashguard.py devinfo.py icon.png java/org/bleremote/BleClient.java java/org/bleremote/KioskHelper.java java/org/bleremote/MediaHelper.java java/org/bleremote/MediaPicker.java layers_view.py main.py mediaplan.py presplash.png protocol.py secure.py secure_flow.py sender_app.py store.py studio.py template_catalog.json templates.py transfer.py workspace_model.py zones.py" ;;
            receiver) req="buildozer.spec commands.py crashguard.py devinfo.py icon.png java/org/bleremote/BleServer.java java/org/bleremote/KioskHelper.java java/org/bleremote/MediaHelper.java java/org/bleremote/VideoHelper.java java/org/bleremote/ZoneVideo.java layers_view.py library.py main.py mediaserver.py playback.py presplash.png protocol.py receiver_app.py secure.py secure_flow.py studio.py template_catalog.json templates.py zones.py zones_view.py" ;;
          esac
          missing=""
          for f in $req; do test -f "${{ steps.loc.outputs.dir }}/$f" || missing="$missing $f"; done
          if [ -n "$missing" ]; then
            echo "::error::Files missing from ${{ steps.loc.outputs.dir }}:$missing"
            echo "::error::Upload the WALIBRA zip file itself to the repository root (do not upload the folders from a phone)."
            exit 1
          fi
          echo "All source files are present."
      - name: Keep the same debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ${{ steps.loc.outputs.dir }}/.buildozer
          key: buildozer-${{ matrix.app }}-${{ hashFiles(format('{0}/buildozer.spec', steps.loc.outputs.dir)) }}
      - name: Install buildozer
        run: pip install buildozer==1.5.0 "cython==0.29.36" virtualenv
      - name: Build APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: yes | buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ steps.loc.outputs.dir }}/bin/*.apk
