name: Build APKs
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        app: [sender, receiver]
    steps:
      - uses: actions/checkout@v4
      - name: Locate the app (unzips WALIBRA_*.zip if you uploaded the zip itself)
        id: loc
        run: |
          root=.
          zipf=$(ls WALIBRA_*.zip 2>/dev/null | sort | tail -n1 || true)
          if [ -n "$zipf" ]; then
            echo "Using $zipf"
            rm -rf _src && mkdir _src && unzip -oq "$zipf" -d _src && root=_src
          fi
          d=$(find "$root" -type d -name "${{ matrix.app }}" -not -path "*/.git/*" -exec test -f {}/main.py \; -print | head -n1)
          d=${d#./}
          test -n "$d" || { echo "::error::could not find a '${{ matrix.app }}' folder containing main.py"; exit 1; }
          echo "App folder: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Check the font is there (needed for joined Arabic + Latin)
        run: |
          ls -la "${{ steps.loc.outputs.dir }}/fonts"
          test -f "${{ steps.loc.outputs.dir }}/fonts/DejaVuSans.ttf" || { echo "::error::fonts/DejaVuSans.ttf is missing"; exit 1; }
      - name: Keep the same debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ${{ steps.loc.outputs.dir }}/.buildozer
          key: buildozer-${{ matrix.app }}-${{ hashFiles(format('{0}/buildozer.spec', steps.loc.outputs.dir)) }}
      - name: Install buildozer
        run: pip install buildozer==1.5.0 "cython==0.29.36" virtualenv
      - name: Build APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: yes | buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ steps.loc.outputs.dir }}/bin/*.apk
